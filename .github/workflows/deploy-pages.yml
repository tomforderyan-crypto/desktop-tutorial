name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: true
      - run: npm ci
        working-directory: overlay-studio
      - run: npm run build
        working-directory: overlay-studio
        env:
          GITHUB_PAGES: true
      - run: npm ci
        working-directory: photo-wall
      # The Supabase URL and publishable key are public by design (the
      # database rules in photo-wall/supabase/setup.sql decide what they can
      # do), so they're repository variables rather than secrets.
      - run: npm run build
        working-directory: photo-wall
        env:
          GITHUB_PAGES: true
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
      # Fieldside owns the site root; Overlay Studio and Photo Wall are
      # separate apps nested under their own folders in the same Pages
      # deployment (GitHub Pages only serves one artifact per repo).
      - run: |
          mkdir -p dist/overlay-studio dist/photo-wall
          cp -r overlay-studio/dist/. dist/overlay-studio/
          cp -r photo-wall/dist/. dist/photo-wall/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
